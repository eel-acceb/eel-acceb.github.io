<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Round Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1B3B2F;
    --green-deep: #12281F;
    --sage: #E9EDE2;
    --rose: #D6787E;
    --rose-deep: #B85960;
    --brass: #C9A227;
    --ink: #1A1F1C;
    --paper: #F6F5EF;
    --correct: #6AAA64;
    --present: #E8C547;
    --wrong: #C25450;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--green);
    background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
                       radial-gradient(circle at 85% 90%, rgba(214,120,126,0.08), transparent 45%);
    min-height: 100vh;
    font-family: 'Work Sans', sans-serif;
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  .vine {
    width: 100%;
    max-width: 480px;
    height: 20px;
    margin-bottom: 20px;
    opacity: 0.9;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(26px, 6vw, 36px);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    text-align: center;
  }

  p.tagline {
    font-size: 15px;
    color: rgba(246,245,239,0.72);
    margin: 0 0 24px;
    text-align: center;
    max-width: 360px;
    line-height: 1.5;
  }

  .active-clue {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--brass);
    min-height: 24px;
    margin-bottom: 16px;
    text-align: center;
  }

  #gridWrap {
    overflow-x: auto;
    max-width: 100%;
    padding-bottom: 8px;
  }

  .grid {
    display: grid;
    gap: 2px;
    background: rgba(246,245,239,0.08);
    padding: 4px;
    border-radius: 8px;
  }

  .cell {
    width: 30px;
    height: 30px;
    background: var(--sage);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cell.blocked {
    background: transparent;
  }

  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    text-align: center;
    text-transform: uppercase;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    padding: 0;
    outline: none;
    caret-color: transparent;
  }

  .cell.active-word input {
    background: rgba(201,162,39,0.25);
  }

  .cell.selected input {
    background: rgba(214,120,126,0.55);
  }

  .cell.correct input {
    background: var(--correct);
    color: var(--green-deep);
  }

  .cell.wrong input {
    background: var(--wrong);
    color: white;
  }

  .num {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 8px;
    font-weight: 700;
    color: rgba(26,31,26,0.55);
    pointer-events: none;
  }

  .clues {
    margin-top: 28px;
    max-width: 420px;
    width: 100%;
  }

  .clue-col {
    margin-bottom: 14px;
  }

  .clue-heading {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--rose);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .clue-item {
    font-size: 13.5px;
    color: rgba(246,245,239,0.85);
    line-height: 1.6;
    padding: 2px 0;
  }

  .clue-item b {
    color: var(--paper);
    margin-right: 4px;
  }

  .clue-item.solved {
    color: rgba(246,245,239,0.4);
    text-decoration: line-through;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .btn {
    border: none;
    border-radius: 30px;
    padding: 12px 26px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.3s ease, transform 0.3s ease;
  }

  .btn.check {
    background: rgba(246,245,239,0.15);
    color: var(--paper);
  }
  .btn.check:hover { background: rgba(246,245,239,0.25); }

  .btn.continue {
    background: var(--rose);
    color: var(--green-deep);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }
  .btn.continue.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .btn.continue:hover { background: var(--rose-deep); }

  .message {
    margin-top: 16px;
    min-height: 24px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: var(--brass);
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .message.show { opacity: 1; }

  @media (max-width: 420px) {
    .cell { width: 26px; height: 26px; }
    .cell input { font-size: 13px; }
  }
</style>
</head>
<body>

<svg class="vine" viewBox="0 0 480 20" preserveAspectRatio="none">
  <path d="M0,10 Q40,2 80,10 T160,10 T240,10 T320,10 T400,10 T480,10" stroke="#D6787E" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="80" cy="10" r="3" fill="#C9A227"/>
  <circle cx="160" cy="10" r="3" fill="#C9A227"/>
  <circle cx="240" cy="10" r="3" fill="rgba(201,162,39,0.3)"/>
  <circle cx="320" cy="10" r="3" fill="rgba(201,162,39,0.3)"/>
  <circle cx="400" cy="10" r="3" fill="rgba(201,162,39,0.3)"/>
</svg>

<h1>Round Two</h1>
<p class="tagline">A crossword only you could solve. Every answer is us.</p>

<div class="active-clue" id="activeClue">Tap a square to begin</div>

<div id="gridWrap">
  <div class="grid" id="grid"></div>
</div>

<div class="actions">
  <button class="btn check" id="checkBtn">Check answers</button>
  <button class="btn continue" id="continueBtn">Continue →</button>
</div>

<div class="message" id="message"></div>

<div class="clues">
  <div class="clue-col">
    <div class="clue-heading">Across</div>
    <div id="acrossClues"></div>
  </div>
  <div class="clue-col">
    <div class="clue-heading">Down</div>
    <div id="downClues"></div>
  </div>
</div>

<script>
  const WORDS = [
    { word: "NOVEMBER", row: 5, col: 0, dir: "across", clue: "Month we started dating" },
    { word: "VILLAGE",  row: 5, col: 2, dir: "down",   clue: "With 7 Down, location of our first kiss" },
    { word: "LINGER",   row: 3, col: 0, dir: "down",   clue: "Our song" },
    { word: "TEN",       row: 4, col: 6, dir: "down",   clue: "Years we've known each other" },
    { word: "SAUNDERS", row: 9, col: 1, dir: "across", clue: "Our first proper date location" },
    { word: "IDIOT",    row: 8, col: 5, dir: "down",   clue: "See 6 Down" },
    { word: "MEISIE",   row: 0, col: 3, dir: "down",   clue: "My pet name for you" },
    { word: "PINK",     row: 2, col: 2, dir: "across", clue: "Colour of our heart" },
    { word: "SAINTS",   row: 9, col: 8, dir: "down",   clue: "Where we became best friends" },
    { word: "ACCEB",    row: 10, col: 8, dir: "across", clue: "Your first nickname" },
  ];

  // Build cell map
  const cells = {}; // "r,c" -> { letter, across: {wordIdx, pos}, down: {wordIdx, pos} }
  WORDS.forEach((w, idx) => {
    for (let i = 0; i < w.word.length; i++) {
      const r = w.row + (w.dir === "down" ? i : 0);
      const c = w.col + (w.dir === "across" ? i : 0);
      const key = `${r},${c}`;
      if (!cells[key]) cells[key] = { letter: w.word[i], across: null, down: null };
      cells[key][w.dir] = { wordIdx: idx, pos: i };
    }
  });

  const allR = Object.keys(cells).map(k => +k.split(',')[0]);
  const allC = Object.keys(cells).map(k => +k.split(',')[1]);
  const minR = Math.min(...allR), maxR = Math.max(...allR);
  const minC = Math.min(...allC), maxC = Math.max(...allC);
  const gridRows = maxR - minR + 1;
  const gridCols = maxC - minC + 1;

  // Assign clue numbers: a cell gets a number if it's the start of an across or down word
  const numbering = {};
  let num = 1;
  const sortedStarts = WORDS.map((w, idx) => ({ idx, r: w.row, c: w.col }))
    .sort((a, b) => a.r - b.r || a.c - b.c);
  const seenCells = {};
  sortedStarts.forEach(s => {
    const key = `${s.r},${s.c}`;
    if (!seenCells[key]) {
      seenCells[key] = num++;
    }
  });
  WORDS.forEach((w, idx) => { w.number = seenCells[`${w.row},${w.col}`]; });

  // Build grid DOM
  const gridEl = document.getElementById('grid');
  gridEl.style.gridTemplateColumns = `repeat(${gridCols}, 30px)`;
  gridEl.style.gridTemplateRows = `repeat(${gridRows}, 30px)`;

  const inputRefs = {}; // "r,c" -> input element

  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      const key = `${r},${c}`;
      const cellDiv = document.createElement('div');
      if (cells[key]) {
        cellDiv.className = 'cell';
        cellDiv.dataset.r = r;
        cellDiv.dataset.c = c;
        if (seenCells[key]) {
          const numSpan = document.createElement('span');
          numSpan.className = 'num';
          numSpan.textContent = seenCells[key];
          cellDiv.appendChild(numSpan);
        }
        const input = document.createElement('input');
        input.autocomplete = 'off';
        input.dataset.r = r;
        input.dataset.c = c;
        cellDiv.appendChild(input);
        inputRefs[key] = input;
      } else {
        cellDiv.className = 'cell blocked';
      }
      gridEl.appendChild(cellDiv);
    }
  }

  // State
  let selected = null; // {r, c}
  let direction = 'across';

  function cellAt(r, c) { return cells[`${r},${c}`]; }

  function getWordCells(wordIdx) {
    const w = WORDS[wordIdx];
    const result = [];
    for (let i = 0; i < w.word.length; i++) {
      const r = w.row + (w.dir === "down" ? i : 0);
      const c = w.col + (w.dir === "across" ? i : 0);
      result.push({ r, c });
    }
    return result;
  }

  function clearHighlights() {
    document.querySelectorAll('.cell').forEach(el => {
      el.classList.remove('active-word', 'selected');
    });
  }

  function highlightActive() {
    clearHighlights();
    if (!selected) return;
    const cellData = cellAt(selected.r, selected.c);
    if (!cellData) return;
    let wordIdx = cellData[direction] ? cellData[direction].wordIdx : (cellData.across ? cellData.across.wordIdx : cellData.down.wordIdx);
    const activeDir = cellData[direction] ? direction : (cellData.across ? 'across' : 'down');
    direction = activeDir;
    const wordCells = getWordCells(wordIdx);
    wordCells.forEach(({r,c}) => {
      const div = gridEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if (div) div.classList.add('active-word');
    });
    const selDiv = gridEl.querySelector(`.cell[data-r="${selected.r}"][data-c="${selected.c}"]`);
    if (selDiv) selDiv.classList.add('selected');

    const w = WORDS[wordIdx];
    document.getElementById('activeClue').textContent = `${w.number} ${w.dir === 'across' ? 'Across' : 'Down'}: ${w.clue}`;
  }

  function selectCell(r, c, forceDir) {
    const cellData = cellAt(r, c);
    if (!cellData) return;
    if (selected && selected.r === r && selected.c === c && !forceDir) {
      // toggle direction if both available
      if (cellData.across && cellData.down) {
        direction = direction === 'across' ? 'down' : 'across';
      }
    } else {
      selected = { r, c };
      if (forceDir) {
        direction = forceDir;
      } else {
        direction = cellData.across ? 'across' : 'down';
      }
    }
    highlightActive();
    const input = inputRefs[`${r},${c}`];
    if (input) input.focus();
  }

  function moveNext() {
    if (!selected) return;
    const cellData = cellAt(selected.r, selected.c);
    const wordIdx = cellData[direction].wordIdx;
    const pos = cellData[direction].pos;
    const w = WORDS[wordIdx];
    if (pos < w.word.length - 1) {
      const nr = w.row + (w.dir === 'down' ? pos + 1 : 0);
      const nc = w.col + (w.dir === 'across' ? pos + 1 : 0);
      selected = { r: nr, c: nc };
      highlightActive();
      const input = inputRefs[`${nr},${nc}`];
      if (input) input.focus();
    }
  }

  function movePrev() {
    if (!selected) return;
    const cellData = cellAt(selected.r, selected.c);
    const wordIdx = cellData[direction].wordIdx;
    const pos = cellData[direction].pos;
    const w = WORDS[wordIdx];
    if (pos > 0) {
      const nr = w.row + (w.dir === 'down' ? pos - 1 : 0);
      const nc = w.col + (w.dir === 'across' ? pos - 1 : 0);
      selected = { r: nr, c: nc };
      highlightActive();
      const input = inputRefs[`${nr},${nc}`];
      if (input) input.focus();
    }
  }

  Object.entries(inputRefs).forEach(([key, input]) => {
    const [r, c] = key.split(',').map(Number);

    input.addEventListener('click', () => selectCell(r, c));
    input.addEventListener('focus', () => {
      if (!selected || selected.r !== r || selected.c !== c) {
        selected = { r, c };
        const cellData = cellAt(r, c);
        direction = cellData.across ? 'across' : 'down';
        highlightActive();
      }
    });

    // Fallback for paste/autofill — clamp to a single letter, but normal
    // typing is handled directly in keydown below so overwrites always work
    input.addEventListener('input', (e) => {
      const val = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(-1);
      e.target.value = val;
      e.target.parentElement.classList.remove('correct', 'wrong');
    });

    input.addEventListener('keydown', (e) => {
      if (/^[a-zA-Z]$/.test(e.key)) {
        e.preventDefault();
        input.value = e.key.toUpperCase();
        input.parentElement.classList.remove('correct', 'wrong');
        moveNext();
      } else if (e.key === 'Backspace') {
        if (input.value) {
          e.preventDefault();
          input.value = '';
          input.parentElement.classList.remove('correct', 'wrong');
        } else {
          movePrev();
          const prevInput = inputRefs[`${selected.r},${selected.c}`];
          if (prevInput) prevInput.value = '';
        }
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        const nc = c + 1;
        if (cellAt(r, nc)) { selected = {r, c: nc}; direction='across'; highlightActive(); inputRefs[`${r},${nc}`].focus(); }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        const nc = c - 1;
        if (cellAt(r, nc)) { selected = {r, c: nc}; direction='across'; highlightActive(); inputRefs[`${r},${nc}`].focus(); }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        const nr = r + 1;
        if (cellAt(nr, c)) { selected = {r: nr, c}; direction='down'; highlightActive(); inputRefs[`${nr},${c}`].focus(); }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const nr = r - 1;
        if (cellAt(nr, c)) { selected = {r: nr, c}; direction='down'; highlightActive(); inputRefs[`${nr},${c}`].focus(); }
      }
    });
  });

  // Render clue lists
  const acrossEl = document.getElementById('acrossClues');
  const downEl = document.getElementById('downClues');
  WORDS.slice().sort((a,b) => a.number - b.number).forEach(w => {
    const div = document.createElement('div');
    div.className = 'clue-item';
    div.id = `clue-${w.word}`;
    div.innerHTML = `<b>${w.number}.</b> ${w.clue}`;
    div.addEventListener('click', () => selectCell(w.row, w.col, w.dir));
    (w.dir === 'across' ? acrossEl : downEl).appendChild(div);
  });

  // Check answers
  document.getElementById('checkBtn').addEventListener('click', () => {
    let allCorrect = true;
    let anyFilled = false;
    Object.entries(inputRefs).forEach(([key, input]) => {
      const cellData = cells[key];
      const div = input.parentElement;
      if (input.value) anyFilled = true;
      if (!input.value) {
        allCorrect = false;
        return;
      }
      if (input.value === cellData.letter) {
        div.classList.add('correct');
        div.classList.remove('wrong');
      } else {
        div.classList.add('wrong');
        div.classList.remove('correct');
        allCorrect = false;
      }
    });

    // Mark solved clues
    WORDS.forEach(w => {
      const wordCells = getWordCells(WORDS.indexOf(w));
      const solved = wordCells.every(({r,c}) => inputRefs[`${r},${c}`].value === cellAt(r,c).letter);
      const clueEl = document.getElementById(`clue-${w.word}`);
      if (clueEl) clueEl.classList.toggle('solved', solved);
    });

    const msg = document.getElementById('message');
    if (!anyFilled) {
      msg.textContent = "Give it a go first";
    } else if (allCorrect) {
      msg.textContent = "All correct. You really do know us.";
      document.getElementById('continueBtn').classList.add('show');
    } else {
      msg.textContent = "Not quite yet. Check the red squares";
    }
    msg.classList.add('show');
    setTimeout(() => { if (!allCorrect) msg.classList.remove('show'); }, 2000);
  });

  document.getElementById('continueBtn').addEventListener('click', () => {
    window.location.href = 'stage-wordsalad.html';
  });

  // Show the first clue immediately on load, like a real crossword app
  selectCell(WORDS[0].row, WORDS[0].col, WORDS[0].dir);
  document.activeElement.blur();
</script>

</body>
</html>
