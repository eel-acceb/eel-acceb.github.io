<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1B3B2F;
    --green-deep: #12281F;
    --sage: #E9EDE2;
    --rose: #D6787E;
    --rose-deep: #B85960;
    --brass: #C9A227;
    --ink: #1A1F1C;
    --paper: #F6F5EF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--green);
    background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.05), transparent 45%),
                       radial-gradient(circle at 85% 85%, rgba(214,120,126,0.1), transparent 50%);
    min-height: 100vh;
    font-family: 'Work Sans', sans-serif;
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 60px;
    overflow-x: hidden;
  }

  .vine {
    width: 100%;
    max-width: 480px;
    height: 20px;
    margin-bottom: 30px;
    opacity: 0.9;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 7vw, 42px);
    margin: 0 0 10px;
    text-align: center;
  }

  p.tagline {
    font-size: 15px;
    color: rgba(246,245,239,0.72);
    margin: 0 0 40px;
    text-align: center;
    max-width: 340px;
    line-height: 1.6;
  }

  .stage {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .box-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    transition: transform 0.4s ease;
  }

  .stage:hover .box-wrap {
    transform: scale(1.04);
  }

  .box-base {
    position: absolute;
    bottom: 0;
    left: 10px;
    width: 160px;
    height: 100px;
    background: var(--rose);
    border-radius: 4px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }

  .box-lid {
    position: absolute;
    top: 40px;
    left: 0;
    width: 180px;
    height: 40px;
    background: var(--rose-deep);
    border-radius: 4px;
    transform-origin: top;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
    z-index: 3;
  }

  .ribbon-v {
    position: absolute;
    top: 0;
    left: 82px;
    width: 16px;
    height: 140px;
    background: var(--brass);
    z-index: 4;
  }

  .ribbon-h {
    position: absolute;
    top: 40px;
    left: 0;
    width: 180px;
    height: 16px;
    background: var(--brass);
    z-index: 4;
  }

  .bow {
    position: absolute;
    top: 20px;
    left: 65px;
    width: 50px;
    height: 30px;
    z-index: 5;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .stage.opened .box-lid {
    transform: translateY(-60px) rotate(-15deg);
    opacity: 0;
  }

  .stage.opened .ribbon-v,
  .stage.opened .ribbon-h,
  .stage.opened .bow {
    opacity: 0;
    transform: scale(0.5);
  }

  .glow {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,150,0.5), transparent 70%);
    transition: transform 0.6s ease;
    pointer-events: none;
  }

  .stage.opened .glow {
    transform: translateX(-50%) scale(1.3);
  }

  .tap-hint {
    margin-top: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: rgba(246,245,239,0.5);
    text-transform: uppercase;
    transition: opacity 0.4s ease;
  }

  .tap-hint.hide { opacity: 0; }

  .reveal-text {
    margin-top: 36px;
    text-align: center;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .reveal-text.show {
    opacity: 1;
    transform: translateY(0);
  }

  .reveal-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--brass);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .reveal-word {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(36px, 10vw, 56px);
    color: var(--paper);
    margin: 0 0 14px;
  }

  .reveal-message {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    color: rgba(246,245,239,0.85);
    max-width: 320px;
    line-height: 1.6;
    margin: 0 auto;
  }

  .heart {
    margin-top: 20px;
    font-size: 22px;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .heart.show { opacity: 1; }
</style>
</head>
<body>

<svg class="vine" viewBox="0 0 480 20" preserveAspectRatio="none">
  <path d="M0,10 Q40,2 80,10 T160,10 T240,10 T320,10 T400,10 T480,10" stroke="#D6787E" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="80" cy="10" r="3" fill="#C9A227"/>
  <circle cx="160" cy="10" r="3" fill="#C9A227"/>
  <circle cx="240" cy="10" r="3" fill="#C9A227"/>
  <circle cx="320" cy="10" r="3" fill="#C9A227"/>
  <circle cx="400" cy="10" r="3" fill="#C9A227"/>
</svg>

<h1>You made it.</h1>
<p class="tagline">Ten years of knowing each other, one year of us. This one's for you.</p>

<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="box-wrap">
    <div class="box-base"></div>
    <div class="ribbon-v"></div>
    <div class="ribbon-h"></div>
    <svg class="bow" viewBox="0 0 50 30">
      <path d="M25,15 C15,0 0,5 5,15 C0,25 15,30 25,15 Z" fill="#C9A227"/>
      <path d="M25,15 C35,0 50,5 45,15 C50,25 35,30 25,15 Z" fill="#C9A227"/>
      <circle cx="25" cy="15" r="5" fill="#B8901F"/>
    </svg>
    <div class="box-lid"></div>
  </div>
</div>

<p class="tap-hint" id="tapHint">Tap the box</p>

<div class="reveal-text" id="revealText">
  <div class="reveal-label">Happy anniversary</div>
  <div class="reveal-word">Present</div>
  <p class="reveal-message">
    Swap this line for whatever you want to say about the actual gift once you know what it is —
    this is just the placeholder moment.
  </p>
  <div class="heart" id="heart">♡</div>
</div>

<script>
  const stage = document.getElementById('stage');
  const tapHint = document.getElementById('tapHint');
  const revealText = document.getElementById('revealText');
  const heart = document.getElementById('heart');

  let opened = false;
  stage.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    stage.classList.add('opened');
    tapHint.classList.add('hide');
    setTimeout(() => {
      revealText.classList.add('show');
    }, 400);
    setTimeout(() => {
      heart.classList.add('show');
    }, 1000);
  });
</script>

</body>
</html>
